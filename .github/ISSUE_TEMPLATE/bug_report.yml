name: Bug report
description: Something in Tvaro IPTV doesn't work as expected.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Tvaro IPTV doesn't provide any channels or content, so we can't help with provider accounts, subscriptions or channel availability. Please don't post server addresses, usernames, passwords or playlist links.
    - type: dropdown
      id: platform
      attributes:
          label: Platform
          options:
              - Windows
              - macOS (Apple Silicon)
              - Linux (.deb)
              - Linux (.rpm)
              - Linux (AppImage)
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: App version
          description: Shown in Settings › About.
          placeholder: 0.1.1
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: Operating system version
          placeholder: Windows 11 24H2, macOS 15.1, Ubuntu 24.04
    - type: dropdown
      id: source
      attributes:
          label: Source type
          options:
              - Xtream Codes
              - M3U playlist
              - Demo mode
              - Not related to a source
    - type: textarea
      id: what
      attributes:
          label: What happened?
          description: What did you expect, and what happened instead? Screenshots help.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Open Live TV
              2. Select a channel
              3. ...
      validations:
          required: true
